name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Matriz nas DUAS linhas de LTS vivas, não só na de baixo: até 31/08/2026
    # este job rodava só em 22 e o `engines.node` do pacote era promessa que
    # nenhum job exercitava — foi assim que o `>=18` do sih-br-mcp sobreviveu
    # sem ninguém notar.
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # A superfície publicada é o produto: initialize + tools/list +
      # resources/list + prompts/list sobre o build, offline. Substitui o
      # smoke artesanal de initialize que existia aqui — o dump cobre o mesmo
      # e mais (as três listas), com o script versionado em vez de inline.
      - name: Dump da superfície (fumaça do build)
        run: node scripts/dump-surface.mjs --stdio > /dev/null
