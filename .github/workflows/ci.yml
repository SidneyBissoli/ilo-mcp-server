name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Matriz nas DUAS linhas de LTS vivas, não só na de baixo: até 31/08/2026
    # este job rodava só em 22 e o `engines.node` do pacote era promessa que
    # nenhum job exercitava — foi assim que o `>=18` do sih-br-mcp sobreviveu
    # sem ninguém notar.
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The stdio runtime must at least start and answer initialize offline.
      - name: stdio smoke (initialize)
        run: |
          node -e '
          const { spawn } = require("node:child_process");
          const p = spawn("node", ["dist/cli.js"], { stdio: ["pipe", "pipe", "inherit"] });
          let out = "";
          p.stdout.on("data", (d) => { out += d; if (out.includes("\"serverInfo\"")) { console.log(out.trim()); p.kill(); process.exit(0); } });
          p.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: { protocolVersion: "2025-06-18", capabilities: {}, clientInfo: { name: "ci", version: "0" } } }) + "\n");
          setTimeout(() => { console.error("no initialize response"); p.kill(); process.exit(1); }, 15000);
          '
