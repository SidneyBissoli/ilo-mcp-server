name: Deploy to Cloudflare Workers

# POR QUE ESTE WORKFLOW EXISTE
#
# O deploy do Worker era manual, e a deriva que isso produz foi MEDIDA em
# 29/08/2026: npm em 0.3.1, endpoint hospedado em 0.3.0. O `publish.yml` publica
# no npm e no MCP Registry e nunca tocou no Worker — então toda release deixava
# produção para trás até alguém lembrar de rodar `wrangler deploy` na mão.
#
# Não é caso isolado: no mesmo dia, a mesma varredura achou npm 4.0.2 contra
# hospedado 4.0.1 no ibge-br-mcp e npm 3.5.1 contra hospedado 3.5.0 no
# senado-br-mcp-cloudflare. No bcb-br-mcp a mesma classe já tinha custado npm
# 1.3.5 contra hospedado 1.3.1, servindo descrições de tool 12x menores em
# produção do que as do fonte. Deploy manual sempre acaba assim; a correção é
# estrutural.
#
# FORMATO DESTE REPOSITÓRIO: o repositório INTEIRO é o Worker (wrangler.jsonc na
# raiz, `main` apontando para src/index.ts, transpilado pelo próprio wrangler).
# Não há subprojeto `worker/` nem passo de "buildar a raiz antes", que nos
# irmãos bcb e ibge é obrigatório porque lá o Worker importa de ../../dist.
#
# Dois gatilhos:
#  - push em main nos caminhos que afetam o Worker;
#  - workflow_dispatch, para redeploy sem mudança de código.
#
# Secrets no GitHub (CADASTRADOS e funcionando — a primeira execução real foi em
# 30/08/2026, run 33315235704, versão 04de9465; o comentário anterior dizia que
# faltavam, e essa afirmação virou premissa errada em outro arquivo antes de
# alguém conferir):
#   CLOUDFLARE_API_TOKEN  — token com permissão "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID — conta em que o worker é publicado
# O job segue se pulando sozinho se um dia sumirem.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - "surface.lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Sem o token, o job é PULADO em vez de falhar: main vermelho por
      # credencial ausente esconde falha de verdade. O deploy segue possível na
      # mão (`npm run deploy` com login local do wrangler).
      - name: Verificar credencial da Cloudflare
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::CLOUDFLARE_API_TOKEN ausente — deploy pulado. Cadastre o secret para ligar o deploy contínuo."
          fi

      - if: steps.cf.outputs.ok == 'true'
        uses: actions/checkout@v7

      # NODE 22 = o piso do projeto desde 31/08/2026 (`engines.node` ">=22").
      # Antes este pino era uma EXCEÇÃO ao piso de 20, porque o wrangler 4.x
      # recusa Node < 22 ("Wrangler requires at least Node.js v22.0.0") e o
      # deploy morria antes de autenticar — medido no senado-br-mcp-cloudflare
      # em 29/08/2026. A exceção virou a regra: não descer daqui.
      - if: steps.cf.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - if: steps.cf.outputs.ok == 'true'
        name: Install
        run: npm ci

      # Não deployar o que não compila: o wrangler transpila na hora e um erro
      # de tipo chegaria a produção como erro de runtime.
      - if: steps.cf.outputs.ok == 'true'
        name: Typecheck
        run: npm run typecheck

      # O DEPLOY SE RECUSA A RODAR COM TESTE VERMELHO. Até 02/10/2026 este job
      # só checava tipos: o ci.yml roda em paralelo no mesmo push e não segura
      # nada. Entre os testes está a trava da superfície
      # (tests/surface-lock.test.ts): mudou sem subir a versão = vermelho aqui,
      # e o wrangler abaixo não roda.
      - if: steps.cf.outputs.ok == 'true'
        name: Testes — inclui a trava da superfície
        run: npm test

      - if: steps.cf.outputs.ok == 'true'
        name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A GUARDA QUE O SMOKE NÃO DÁ. O smoke abaixo exercita a superfície, mas
      # passaria IGUAL servindo a versão anterior — que é justamente a deriva
      # que este workflow existe para impedir, e foi assim que a 0.3.0 ficou no
      # ar sem ninguém notar. Comparar o que /status reporta com o package.json
      # torna a deriva vermelha em vez de silenciosa.
      - if: steps.cf.outputs.ok == 'true'
        name: Versão hospedada bate com o package.json
        run: |
          # Repete por até 3 min (06/10/2026). Uma leitura única após `sleep 20` dava
          # vermelho falso quando o Worker novo demorava a chegar à borda — e o falso
          # vermelho PULAVA o smoke e a conferência da superfície (medido no senado,
          # run 37515023242). /status responde `no-store`: o atraso é propagação.
          ESPERADA=$(node -p "require('./package.json').version")
          PRAZO=180; INTERVALO=10; INICIO=$(date +%s); NO_AR="?"
          while :; do
            # Falha de rede ou JSON inválido não derruba o laço: vira "?" e tenta de novo.
            NO_AR=$(curl -sS --max-time 30 https://ilo.sidneybissoli.com/status 2>/dev/null \
              | node -e "try{console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).version)}catch{console.log('?')}" \
              || echo "?")
            DECORRIDO=$(( $(date +%s) - INICIO ))
            echo "t=${DECORRIDO}s  package.json=$ESPERADA  hospedado=$NO_AR"
            [ "$ESPERADA" = "$NO_AR" ] && exit 0
            if [ "$DECORRIDO" -ge "$PRAZO" ]; then
              echo "::error::deriva: após ${PRAZO}s o endpoint serve $NO_AR e o repositório está em $ESPERADA"
              exit 1
            fi
            sleep "$INTERVALO"
          done

      # Fecha o ciclo: se o deploy subir um Worker quebrado, o job falha aqui e
      # não em silêncio na próxima vez que alguém abrir o endpoint.
      - if: steps.cf.outputs.ok == 'true'
        name: Smoke em produção
        run: node scripts/smoke-mcp.mjs

      # O que subiu é o que foi travado: superfície declarada servida sem
      # credencial e, método a método, quem responde sem token (produção =
      # API_KEY ausente). Os testes provam o CÓDIGO; isto prova o ENDPOINT.
      - if: steps.cf.outputs.ok == 'true'
        name: Superfície no ar = surface.lock.json
        run: npx mcp-surface verificar https://ilo.sidneybissoli.com/mcp --tool ilo_search_indicators --args '{"query":"unemployment"}'
